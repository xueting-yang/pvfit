# Evaluation settings only. Supply HDF5 input and output with CLI options.
# Optional paths.input_hdf5 / paths.output_dir are relative to the working directory.
analysis:
  method_name: PVfit
  # One event-reading pass shared by all analyses. CLI overrides these settings.
  workers: 1
  batches: null  # automatic: four batches per worker, capped by the event count
  work_dir: null  # default: <output>/.parallel_work; each run owns a fresh subdirectory
  keep_columns: false  # retain temporary residual/pull columns for diagnostics
  analyses:
    - efficiency_track
    - efficiency_geo
    - fake_rate_track
    - fake_rate_geo
    - merge_rate
    - split_rate
    - merge_rate_geo
    - split_rate_geo
    - resolution
    - plot_histogram
    - track_pull
    - vertex_pull

  # Reconstructed-to-true vertex matching for performance evaluation.
  recall_threshold: 0.7
  purity_threshold: 0.7
  z_scale: 1.5
  t_scale: 0.06
  m_r: 0.8
  nsigma: 5.0

  # null follows reconstruction's max_chi2 saved with the HDF5 result.
  # Set a number only to override the cut for a diagnostic comparison.
  track_pull_chi2: null

  # Existing vertex-resolution selection; not a track-pull cut.
  x_residual_range: 0.1  # mm
  y_residual_range: 0.1  # mm
  z_residual_range: 0.7  # mm
  t_residual_range: 0.06 # ns

  # Track-multiplicity binning; overall rates include vertices outside these bins.
  plot_min_ntracks: 4
  plot_max_ntracks: 200
  plot_bin_width_ntracks: 5

  # Display limit for all LHCb2 efficiency plots with error bars.
  efficiency_plot_max_ntracks: 150
  rate_plot_max_ntracks: 150
  # Empty: use rate central values, not error-bar ends, to choose the y range.
  # Optional per-plot override, e.g. {split_rate_geo_rec: 0.001}.
  rate_plot_ymax: {}

  # Set both to the original run/event numbers, or leave both null for the first event.
  plot_run_number: null
  plot_event_number: null
  draw_fixed_ellipses: false
  draw_fitted_ellipses: true
